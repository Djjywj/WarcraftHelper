[Options]

# 是否解锁FPS限制
UnlockFPS = true

# 是否固定显示FPS, 可以游戏中使用/fps指令关闭
ShowFPS = true

# 开启宽屏支持
WideScreen = true

# 窗口化模式自动全屏
AutoFullScreen = false

# 解锁地图大小限制
UnlockMapSize = true

# 1.20E版本自动显血
ShowHPBar = false

# 自动保存录像
AutoSaveReplay = true

# 开启FPS最大锁帧
FpsLimit = true

# FPS最大锁帧
TargetFps = 300

# 把鼠标限制在游戏窗口内, 防止鼠标滑到另一个屏幕
# 仅窗口化/窗口全屏需要此项; 独占全屏时游戏本来就会锁住鼠标
# 切到其他程序, 或游戏弹出对话框时, 会自动解锁
CursorLock = true
